[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "department-guesser-backend"
version = "1.1.0"
description = "Flask API for the Department Guesser game"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.1",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "gunicorn==23.0.0",
  "marshmallow==3.23.2",
  "psycopg2-binary==2.9.12",
  "PyJWT==2.10.1",
  "python-dotenv==1.2.2",
  "SQLAlchemy==2.0.51",
  "Werkzeug==3.1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true
